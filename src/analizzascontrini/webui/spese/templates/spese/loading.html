{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% trans "Reading receipt..." %} </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .loading-card {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .spinner { 
            border: 6px solid #f3f3f3; 
            border-top: 6px solid #0d6efd; 
            border-radius: 50%; 
            width: 60px; 
            height: 60px; 
            animation: spin 1.5s linear infinite; 
            margin: 0 auto 20px; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="card shadow loading-card p-4">
        <h4 class="mb-3">
            <i class="bi bi-receipt text-primary"></i> {% trans "Reading receipt..." %}
        </h4>
        
        <div class="spinner" id="main-spinner"></div>
        
        <!-- Stato generale -->
        <div id="status" class="text-muted mb-2">{% trans "Waiting for the worker..." %}</div>
        
        <!-- Step dettagliato -->
        <div id="step" class="fw-bold text-primary mb-3" style="min-height: 24px;">
            {{ task.step|default:"Inizializzazione..." }}
        </div>
        
        <!-- Barra di progresso -->
        <div class="progress mb-2" style="height: 12px;">
            <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                 role="progressbar" style="width: {{ task.progress }}%"></div>
        </div>
        <div id="progress-text" class="fw-bold mb-3">{{ task.progress }}%</div>

        <!-- Pulsante Riprova (nascosto di default) -->
        <button id="retry-btn" class="btn btn-warning w-100" style="display: none;">
            <i class="bi bi-arrow-clockwise"></i> {% trans "Retry" %}
        </button>
        <button id="cancel-btn" class="btn btn-danger w-100" style="display: none;">
            <i class="bi bi-x-circle"></i> {% trans "Cancel Receipt" %}
        </button>
    </div>

    <!-- 1. Carica il manager generico -->
<script src="{% static 'js/task-ws-manager.js' %}"></script>

<script>
    // ✅ 1. Configurazione iniziale
    const statoIniziale = "{{ task.status }}".trim().toUpperCase();
    const taskId = "{{ task.id }}";
    const scontrinoId = "{{ task.receipt.id }}"; 
    
    // ⚠️ ATTENZIONE: Se questa è la pagina di loading della CATEGORIZZAZIONE, 
    // dovresti usare 'review_categoria' invece di 'review_scontrino'. 
    // Controlla se è questo il caso!
    const reviewUrl = "{% url 'review_scontrino' 0 %}".replace('0', scontrinoId);
    
    const errorMsgDjango = "{{ task.error|escapejs }}".trim();

    function handleFailedState(errorMsg) {
        const statusEl = document.getElementById("status");
        if (statusEl) statusEl.innerHTML = `<span class="text-danger fw-bold">Error: ${errorMsg}</span>`;
        
        const stepEl = document.getElementById("step");
        if (stepEl) stepEl.innerText = "Elaborazione fallita";
        
        const progressBar = document.getElementById("progress-bar");
        if (progressBar) {
            progressBar.classList.remove("bg-primary", "progress-bar-animated");
            progressBar.classList.add("bg-danger");
            progressBar.style.width = "100%";
        }
        
        const spinner = document.getElementById("main-spinner");
        if (spinner) spinner.style.display = "none";
        
        const retryBtn = document.getElementById("retry-btn");
        const cancelBtn = document.getElementById("cancel-btn");
        if (retryBtn) retryBtn.style.display = "inline-block";
        if (cancelBtn) cancelBtn.style.display = "inline-block";
    }

    // Funzione centrale per gestire il completamento (evita duplicazione di codice)
    function triggerCompletionRedirect() {
        console.log("🚀 triggerCompletionRedirect eseguito!");
        const statusEl = document.getElementById("status");
        if (statusEl) statusEl.innerText = "Fatto! Reindirizzamento...";
        
        const stepEl = document.getElementById("step");
        if (stepEl) stepEl.innerText = "Elaborazione completata";
        
        const progressBar = document.getElementById("progress-bar");
        if (progressBar) {
            progressBar.classList.remove("bg-primary", "progress-bar-animated");
            progressBar.classList.add("bg-success");
            progressBar.style.width = "100%";
        }
        
        const spinner = document.getElementById("main-spinner");
        if (spinner) spinner.style.display = "none";
        
        console.log("🔗 Redirecting a:", reviewUrl);
        setTimeout(() => { window.location.href = reviewUrl; }, 1500);
    }

    // 2. Gestione stato iniziale (appena la pagina carica)
    if (statoIniziale === "COMPLETED") {
        console.log("✅ Stato iniziale COMPLETED rilevato.");
        triggerCompletionRedirect();
    } 
    else if (statoIniziale === "FAILED") {
        handleFailedState(errorMsgDjango || "Errore sconosciuto");
    } 
    else {
        // 3. Se è in PENDING o PROCESSING, usiamo il Manager
        const wsManager = new TaskWebSocketManager(taskId, statoIniziale, {
            onProcessing: (data) => {
                console.log("📩 DATO WS RICEVUTO:", data);
                
                // 🔥 FALLBACK INFALLIBILE: Se onCompleted non scatta, lo gestiamo qui
                if (data.status === "COMPLETED" || data.status === "completed") {
                    console.log("✅ COMPLETAMENTO RILEVATO DENTRO onProcessing!");
                    triggerCompletionRedirect();
                    return; // Usciamo per non eseguire il resto dell'aggiornamento UI
                }

                const statusEl = document.getElementById("status");
                if (statusEl) statusEl.innerText = "Stato: " + data.status;
                
                const stepEl = document.getElementById("step");
                if (stepEl && data.step) stepEl.innerText = data.step;
                
                const progressBar = document.getElementById("progress-bar");
                if (progressBar && data.progress !== undefined) {
                    progressBar.style.width = data.progress + "%";
                }
                
                const progressText = document.getElementById("progress-text");
                if (progressText && data.progress !== undefined) {
                    progressText.innerText = data.progress + "%";
                }
            },
            onFailed: (data) => {
                console.error("❌ WS Failed:", data);
                handleFailedState(data.error || "Errore sconosciuto");
            },
            onCompleted: (data) => {
                console.log("✅ onCompleted callback attivato dal Manager!");
                triggerCompletionRedirect();
            },
            onError: (err) => {
                console.error("Errore WebSocket:", err);
                const statusEl = document.getElementById("status");
                if (statusEl) statusEl.innerHTML = `<span class="text-danger">Errore di connessione WebSocket</span>`;
            }
        });

        wsManager.start();
    }

    // =========================================================
    // LOGICA DEI PULSANTI (Retry / Cancel)
    // =========================================================
    const retryBtn = document.getElementById("retry-btn");
    if (retryBtn) {
        retryBtn.addEventListener("click", async function() {
            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Riavvio...';
            
            try {
                const response = await fetch(`/scontrini/task/${taskId}/retry/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });
                
                if (response.ok) {
                    setTimeout(() => { window.location.reload(); }, 500);
                } else {
                    alert("Errore nel riavvio del task.");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Riprova Elaborazione';
                }
            } catch (error) {
                alert("Errore di connessione durante il riavvio.");
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Riprova Elaborazione';
            }
        });
    }

    const cancelBtn = document.getElementById("cancel-btn");
    if (cancelBtn) {
        cancelBtn.addEventListener("click", async function() {
            if (!confirm("Vuoi eliminare questo scontrino?")) return;
            
            const btn = this;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Eliminazione...';

            try {
                const response = await fetch(`/scontrini/task/${taskId}/cancel/`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': '{{ csrf_token }}',
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                if (response.ok) {
                    window.location.href = "/scontrini/upload/";
                } else {
                    alert("Errore durante l'eliminazione");
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-trash"></i> Elimina Scontrino';
                }
            } catch (error) {
                alert("Errore di connessione");
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-trash"></i> Elimina Scontrino';
            }
        });
    }
</script>
   
</body>
</html>
